apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-a-ksa
  namespace: apps
  annotations:
    iam.gke.io/gcp-service-account: app-a-sa@gke-assessment.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-a-config
  namespace: apps
data:
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
  labels: { app: app-a }
spec:
  replicas: 3
  selector:
    matchLabels: { app: app-a }
  template:
    metadata:
      labels: { app: app-a }
    spec:
      serviceAccountName: app-a-ksa
      containers:
      - name: hello-app
        image: us-docker.pkg.dev/gke-assessment/apps/hello-app:1.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef: { name: app-a-config }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: app-a }
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-a
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-a
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 60 }
